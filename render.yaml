services:
  - type: web
    name: rotoloji-streamlit
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: ./run_streamlit_live.sh
    initialDeployHook: ./scripts/render_seed.sh
    envVars:
      - key: STRAPI_MEDIA_MODE
        value: external
      - key: STREAMLIT_DATA_MODE
        value: api
      - key: STRAPI_URL
        fromService:
          type: web
          name: rotoloji-strapi
          envVarKey: RENDER_EXTERNAL_URL
      - key: STRAPI_EMAIL
        fromService:
          type: web
          name: rotoloji-strapi
          envVarKey: INGEST_USER_EMAIL
      - key: STRAPI_PASSWORD
        fromService:
          type: web
          name: rotoloji-strapi
          envVarKey: INGEST_USER_PASSWORD
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: WIKIMEDIA_USER_AGENT
        sync: false
  - type: web
    name: rotoloji-strapi
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: rotoloji-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: true
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: false
      - key: IS_PROXIED
        value: true
      - key: STRAPI_PLUGIN_I18N_INIT_LOCALE_CODE
        value: tr
      - key: PUBLIC_URL
        sync: false
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: INGEST_USER_EMAIL
        sync: false
      - key: INGEST_USER_USERNAME
        sync: false
      - key: INGEST_USER_PASSWORD
        sync: false

databases:
  - name: rotoloji-postgres
    plan: free
