[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rotayz"
version = "0.1.0"
description = "AI-assisted multilingual travel guide automation for Strapi and Streamlit."
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.13.0,<5",
  "charset-normalizer>=3.4.2,<4",
  "deep-translator>=1.11.4,<2",
  "python-dotenv>=1.1.0,<2",
  "requests>=2.32.0,<3",
  "streamlit>=1.57.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
