name: deploy-render

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest -q

  deploy:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Trigger Streamlit deploy on Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${DEPLOY_HOOK}" ]; then
            echo "RENDER_FRONTEND_DEPLOY_HOOK_URL is not configured; skipping frontend deploy."
            exit 0
          fi
          curl -fsS -X POST "${DEPLOY_HOOK}"

      - name: Trigger Strapi deploy on Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${DEPLOY_HOOK}" ]; then
            echo "RENDER_BACKEND_DEPLOY_HOOK_URL is not configured; skipping backend deploy."
            exit 0
          fi
          curl -fsS -X POST "${DEPLOY_HOOK}"
